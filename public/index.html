<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>SmarTest – AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <h1><span>SmarTest</span> – Inteligență Artificială</h1>

    <div class="card">
        <h3>Generează întrebări</h3>

        <div class="question-count">
            <label for="nashCount">Nash:</label>
            <input type="number" id="nashCount" value="0" min="0">
        </div>
        <div class="question-count">
            <label for="cspCount">CSP:</label>
            <input type="number" id="cspCount" value="0" min="0">
        </div>
        <div class="question-count">
            <label for="minmaxCount">Minimax:</label>
            <input type="number" id="minmaxCount" value="0" min="0">
        </div>
        <div class="question-count">
            <label for="strategyCount">Strategie:</label>
            <input type="number" id="strategyCount" value="0" min="0">
        </div>

        <!-- Add more types later, e.g., nqueens -->
        <!--
        <div class="question-count">
            <label for="nqueensCount">N-Queens:</label>
            <input type="number" id="nqueensCount" value="0" min="0">
        </div>
        -->

        <button id="generateBtn">⚡ Generează întrebări</button>
        <button id="downloadPdfBtn">📄 Descarcă PDF</button>
        <div class="card">
            <label class="switch-wrapper">
                <input type="checkbox" id="includeSolutions">
                <span class="slider"></span>
                <span class="label-text">Include soluțiile</span>
            </label>
        </div>
        <pre id="question" class="muted">Nicio întrebare generată încă.</pre>
    </div>

    <div class="card">
        <h3>Evaluare răspuns</h3>

        <div class="file-row compact">
            <label for="answerFile" class="file-btn small">📂 Fișier</label>
            <span id="fileName" class="muted small">niciun fișier</span>
        </div>
        <input type="file" id="answerFile" hidden>

        <div class="question-select">
            <label for="questionNumbers">Numere întrebări (ex: 1,2,4):</label>
            <input type="text" id="questionNumbers" placeholder="1,2,3">
        </div>

        <br>
        <button id="evaluateBtn">📊 Evaluează</button>
    </div>

    <div class="card" id="result"></div>

    <div class="footer">
        AI Exam Preparation • Local Evaluation • No Agent Runtime
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
